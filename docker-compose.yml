services:
  postgres:
    image: postgres:17
    container_name: taskdb
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks

    ports:
      - "5432:5432"

    volumes:
      - taskdata:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: taskapi

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    env_file:
      - .env

    command: node server.js

volumes:
  taskdata: